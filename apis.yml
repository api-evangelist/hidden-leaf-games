name: Hidden Leaf Games
description: Hidden Leaf Games is an independent video game development studio founded in 2019
  and based in the United States. The studio builds competitive multiplayer games centered on
  competition, progression, and social play, with a stated mission of delivering a world-class
  experience where games are meant to be played together regardless of skill level or platform.
  The company is led by CEO David Li and President Bao Lam and raised seed funding from Lightspeed
  Venture Partners in 2021. Hidden Leaf Games is a consumer gaming company and does not currently
  publish a public developer platform, API, or SDK; this profile tracks it as a portfolio-sourced
  lead in the API Evangelist network for ongoing enrichment.
